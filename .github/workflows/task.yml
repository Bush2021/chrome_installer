name: Check Update and Upload Releases

on:
  push: 
    branches: main
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Check Update
      run: go run . fetch

    - name: Download Latest Stable Releases
      run: go run . download win_stable_x86 win_stable_x64 win_stable_arm64

    - name: Check Workflow Status
      run: go run . workflow-status

    - name: Configure Git
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

    - name: Commit Files
      if: env.metadata_changed == 'true'
      run: |
        git add -- data.json readme.md
        git commit -m "${{ env.commit_message }}" --only -- data.json readme.md

    - name: Push Changes
      run: git push origin main

    - name: Create Tag
      if: env.exe_exists == 'true' && env.tag_exists == 'false'
      run: |
        git tag ${{ env.latest_version }}
        git push origin ${{ env.latest_version }}

    - name: Upload Release
      if: env.exe_exists == 'true' && env.tag_exists == 'false'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ env.latest_version }}
        files: '*.exe'

    - name: Reset Main Branch
      if: env.exe_exists == 'true' && env.tag_exists == 'false'
      run: |
        git checkout --orphan temp_branch
        git commit -m "Init"
        git push --force origin temp_branch:main

  # The signed feed Pitstop reads. It lives alone in the orphan branch feed,
  # so main's resets leave it alone, and is served from there by
  # raw.githubusercontent.com and jsDelivr. A separate job keeps the key away
  # from the release action.
  feed:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Configure Git
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

    - name: Prepare Feed
      env:
        FEED_SIGNING_KEY: ${{ secrets.FEED_SIGNING_KEY }}
      run: go run . prepare-feed

    - name: Publish Feed
      if: env.feed_changed == 'true'
      run: git push --force origin "${{ env.feed_commit }}:refs/heads/feed"
